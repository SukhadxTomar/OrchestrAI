[project]
name = "orchestrai"
version = "0.1.0"
description = "Autonomous software engineering platform powered by multi-agent AI and LangGraph"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.28.1",
    "langgraph>=1.2.9",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "rich>=15.0.0",
    "structlog>=24.1",
    "typer>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
]

[project.scripts]
orchestrai = "orchestrai.interfaces.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrai"]

# ── Ruff: linter AND formatter (replaces Black) ─────────────────────────────
[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "RUF", # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["orchestrai"]

# ── Pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
markers = [
    "eval: end-to-end evals against real LLMs (opt-in, costs money)",
]

# ── Mypy: strict from day one ────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["orchestrai"]
